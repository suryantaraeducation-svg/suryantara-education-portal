<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b50">
<title>Buat Kata Sandi | Suryantara Education</title>
<style>
:root{--navy:#102b50;--navy2:#183d6b;--gold:#c89b36;--ink:#203047;--muted:#64748b;--line:#dce3ec;--bg:#f3f6fa;--danger:#b42318;--success:#147d4a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;background:radial-gradient(circle at top right,#e8edf6 0,var(--bg) 48%,#edf1f6 100%);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.card{width:min(100%,460px);background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 16px 45px rgba(16,43,80,.10)}
.brand{text-align:center;margin-bottom:24px}.brand-mark{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:16px;background:var(--navy);color:#fff;font-size:27px;border-bottom:4px solid var(--gold);margin-bottom:12px}
.brand-name{margin:0;color:var(--navy);font-size:21px;letter-spacing:1px;font-weight:800}.brand-sub{margin:5px 0 0;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:2px}
h1{margin:0 0 8px;color:var(--navy);font-size:24px}.intro{margin:0 0 22px;color:var(--muted);line-height:1.6;font-size:14px}
label{display:block;margin:16px 0 7px;font-size:14px;font-weight:700}input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;outline:none;background:#fff}
input:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(24,61,107,.12)}.hint{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;color:white;background:var(--navy);font-size:15px;font-weight:700;cursor:pointer}button:hover{background:var(--navy2)}button:disabled{opacity:.55;cursor:wait}
.message{display:none;padding:12px 14px;border-radius:10px;margin-top:16px;font-size:14px;line-height:1.5}.message.error{display:block;background:#fff0ef;color:var(--danger);border:1px solid #f6c8c5}.message.success{display:block;background:#edfbf3;color:var(--success);border:1px solid #b8e8cc}
.footer{margin-top:22px;color:var(--muted);font-size:12px;text-align:center;line-height:1.6}@media(max-width:480px){.card{padding:24px 20px}h1{font-size:22px}}
</style></head>
<body><main class="card">
<header class="brand"><div class="brand-mark" aria-hidden="true">✦</div><p class="brand-name">SURYANTARA</p><p class="brand-sub">EDUCATION</p></header>
<h1>Buat Kata Sandi</h1><p class="intro">Selamat bergabung dengan Suryantara Education. Buat kata sandi untuk mengaktifkan akses akun tentor Anda.</p>
<form id="setPasswordForm">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required readonly>
<label for="password">Kata sandi baru</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required><p class="hint">Gunakan minimal 10 karakter. Hindari kata sandi yang mudah ditebak.</p>
<label for="confirmPassword">Konfirmasi kata sandi</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required>
<button id="submitButton" type="submit">Simpan Kata Sandi</button><div id="message" class="message" role="status" aria-live="polite"></div></form>
<p class="footer">Tautan pengaturan kata sandi bersifat pribadi. Jangan bagikan kepada orang lain.</p></main>
<script>
/*
PENTING:
1. Ganti API_URL dengan URL deployment Apps Script yang menangani akun tentor.
2. Backend harus menyediakan:
   GET ?action=validateSetPasswordToken&token=...
   POST { action: "setTutorPassword", data: { token: "...", password: "..." } }
3. Jangan aktifkan halaman ini sebelum endpoint backend dibuat dan diuji.
*/
const API_URL="https://script.google.com/macros/s/AKfycbzNVywSqEdDSfnvqIPrD78tUApidTvmU4xJwHW8worB9lhIbvHecwBUONrsfnhNs8Pq/exec";
const params=new URLSearchParams(window.location.search),token=params.get("token")||"",usernameFromUrl=params.get("username")||"";
const form=document.getElementById("setPasswordForm"),usernameInput=document.getElementById("username"),passwordInput=document.getElementById("password"),confirmInput=document.getElementById("confirmPassword"),button=document.getElementById("submitButton"),message=document.getElementById("message");
function showMessage(text,type){message.textContent=text;message.className="message "+type}
async function readJsonResponse(response){const text=await response.text();try{return JSON.parse(text)}catch(_){throw new Error("Respons server tidak valid. Periksa URL deployment Apps Script.")}}
async function initialize(){
 if(!token){form.hidden=true;showMessage("Tautan tidak lengkap. Gunakan tautan pengaturan kata sandi yang diberikan admin.","error");return}
 if(API_URL==="https://script.google.com/macros/s/AKfycbzNVywSqEdDSfnvqIPrD78tUApidTvmU4xJwHW8worB9lhIbvHecwBUONrsfnhNs8Pq/exec"){form.hidden=true;showMessage("Halaman belum terhubung ke server. Admin perlu menyelesaikan konfigurasi Apps Script terlebih dahulu.","error");return}
 try{const response=await fetch(API_URL+"?action=validateSetPasswordToken&token="+encodeURIComponent(token),{method:"GET",redirect:"follow"});const result=await readJsonResponse(response);if(!result.success){form.hidden=true;showMessage(result.message||"Tautan tidak valid atau sudah kedaluwarsa.","error");return}usernameInput.value=result.username||usernameFromUrl||""}
 catch(error){form.hidden=true;showMessage("Tidak dapat memeriksa tautan ke server. Pastikan URL Apps Script dan deployment sudah benar.","error")}
}
form.addEventListener("submit",async event=>{
 event.preventDefault();const password=passwordInput.value,confirmPassword=confirmInput.value;
 if(password.length<10){showMessage("Kata sandi harus minimal 10 karakter.","error");return}
 try{const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"setTutorPassword",data:{token:token,password:password}}),redirect:"follow"});const result=await readJsonResponse(response);if(!result.success)throw new Error(result.message||"Kata sandi gagal disimpan.");form.reset();form.hidden=true;showMessage("Kata sandi berhasil dibuat. Silakan kembali ke halaman login dan masuk menggunakan username Anda.","success")}
 catch(error){showMessage(error.message||"Terjadi kesalahan saat menyimpan kata sandi.","error")}
 finally{button.disabled=false;button.textContent="Simpan Kata Sandi"}
});
initialize();
</script></body></html>
