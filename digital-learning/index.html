
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suryantara Digital Learning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f8fc;
      color: #172b4d;
    }

    header {
      padding: 22px 7%;
      background: #ffffff;
      border-bottom: 1px solid #e8eaf0;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
      color: #142b52;
    }

    .brand span {
      color: #c69b43;
    }

    main {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .content {
      max-width: 650px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    p {
      color: #64748b;
      line-height: 1.7;
      font-size: 16px;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 30px;
      background: #142b52;
      color: white;
      text-decoration: none;
      border-radius: 7px;
      font-weight: bold;
    }

    .button:hover {
      background: #203d70;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #8490a3;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">
      SURYANTARA <span>DIGITAL LEARNING</span>
    </div>
  </header>

  <main>
    <div class="content">
      <h1>Belajar Hari Ini, Bersinar Esok Hari</h1>

      <p>
        Selamat datang di Suryantara Digital Learning.
        Platform pembelajaran digital untuk membantu
        siswa belajar secara terarah, mandiri, dan menyenangkan.
      </p>

      <a href="login.html" class="button">
        Login Siswa
      </a>
    </div>
  </main>

  <footer>
    © 2026 Suryantara Education. All rights reserved.
  </footer>

</body>
</html>
