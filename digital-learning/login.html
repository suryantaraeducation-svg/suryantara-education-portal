
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Siswa | Suryantara Digital Learning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #142b52;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 38px 32px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 35px rgba(20,43,82,.08);
    }

    .brand {
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .brand span {
      color: #c69b43;
    }

    h1 {
      font-size: 25px;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #718096;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 17px 0 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9dfeb;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #142b52;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #142b52;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      font-size: 13px;
      line-height: 1.5;
    }

    .error {
      display: block !important;
      background: #fff0f0;
      color: #b42318;
    }

    .success {
      display: block !important;
      background: #edf9f0;
      color: #16723b;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #718096;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="brand">
      SURYANTARA <span>DIGITAL LEARNING</span>
    </div>

    <h1>Selamat Datang</h1>

    <p class="subtitle">
      Silakan masuk menggunakan akun siswa Anda.
    </p>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Login Siswa
      </button>

      <div id="message" role="alert"></div>

        </form>

    <p style="text-align:center; font-size:14px; margin-top:22px;">
      Belum memiliki akun?
      <a href="register.html"
         style="color:#142b52; font-weight:bold; text-decoration:none;">
        Daftar sekarang
      </a>
    </p>

    <a href="index.html" class="back">
      ← Kembali ke halaman utama
    </a>

  </div>

  <script>
    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbwTyRdsC7Na1KVXcgnWHIZdyUUGA8NjTEpr5JybaTgVfJ4SNd0pDq1MuHA4VtOp8TBC/exec";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.className = "";
      message.textContent = "";

      button.disabled = true;
      button.textContent = "Memeriksa akun...";

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "login",
            email: email,
            password: password
          })
        });

        if (!response.ok) {
          throw new Error("Server tidak dapat dihubungi.");
        }

        const result = await response.json();

        if (!result.success || !result.token) {
          throw new Error(result.message || "Login gagal.");
        }

        // Simpan token dan informasi akun untuk sesi browser.
        sessionStorage.setItem("sdl_token", result.token);
        sessionStorage.setItem(
          "sdl_user",
          JSON.stringify(result.user)
        );
        sessionStorage.setItem(
          "sdl_expires_at",
          result.expiresAt
        );

        message.className = "success";
        message.textContent = "Login berhasil. Mengarahkan ke dashboard...";

        // Dashboard akan kita buat pada tahap berikutnya.
        window.location.href = "dashboard.html";

      } catch (error) {
        message.className = "error";
        message.textContent =
          error.message || "Terjadi kesalahan saat login.";

        button.disabled = false;
        button.textContent = "Login Siswa";
      }
    });
  </script>

</body>
</html>
