
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Suryantara Education</title>
  <meta name="description" content="Portal layanan orang tua dan siswa Suryantara Education.">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172b4d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .portal {
      background: white;
      width: 100%;
      max-width: 480px;
      padding: 36px 24px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .symbol {
      font-size: 54px;
      margin-bottom: 12px;
    }

    h1 {
      color: #123b70;
      font-size: 27px;
      margin: 0 0 8px;
    }

    .gold {
      color: #c69a32;
      font-weight: bold;
      letter-spacing: 3px;
    }

    p {
      color: #52627a;
      line-height: 1.7;
      margin: 20px 0;
    }

    .button {
      display: block;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: bold;
    }

    .primary {
      background: #123b70;
      color: white;
    }

    .secondary {
      border: 1px solid #123b70;
      color: #123b70;
    }

    footer {
      margin-top: 26px;
      font-size: 12px;
      color: #77849a;
    }
  </style>
</head>
<body>
  <main class="portal">
    <div class="symbol">☀️📖</div>
    <h1>SURYANTARA</h1>
    <div class="gold">EDUCATION</div>

    <p>
      Selamat datang di Portal Suryantara Education.
      Akses layanan belajar siswa dan informasi bagi orang tua
      melalui portal kami.
    </p>

    <a class="button primary" href="login.html">
      Masuk ke Portal
    </a>

    <a class="button secondary" href="admin-dashboard.html">
      Dashboard Admin
    </a>

    <footer>
      Belajar Hari Ini, Bersinar Esok Hari
    </footer>
  </main>
</body>
</html>
